<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1f8ceb">
    <title>Интерграм — чат поддержки</title>

    <style>
        :root {
            --blue: #1f8ceb;
            --blue-dark: #176fc1;
            --ink: #172033;
            --muted: #657189;
            --line: #e7ebf2;
            --surface: #ffffff;
            --background: #f4f7fb;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            margin: 0;
            color: var(--ink);
            background:
                radial-gradient(circle at 85% 10%, rgba(31, 140, 235, 0.12), transparent 28%),
                var(--background);
            font-family: Inter, Lato, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        a { color: inherit; }

        .container {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
        }

        header {
            height: 76px;
            border-bottom: 1px solid rgba(231, 235, 242, 0.9);
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(14px);
        }

        .header-inner {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .brand-mark {
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            color: #fff;
            background: var(--blue);
            box-shadow: 0 8px 18px rgba(31, 140, 235, 0.24);
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 14px;
        }

        .status::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #27ae60;
            box-shadow: 0 0 0 4px rgba(39, 174, 96, 0.12);
        }

        main {
            min-height: calc(100vh - 76px);
            display: grid;
            align-items: center;
            padding: 48px 0 96px;
        }

        .hero {
            display: grid;
            grid-template-columns: minmax(0, 1.08fr) minmax(320px, 0.92fr);
            gap: 72px;
            align-items: center;
        }

        .eyebrow {
            margin: 0 0 18px;
            color: var(--blue-dark);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 680px;
            margin: 0;
            font-size: clamp(42px, 6vw, 68px);
            line-height: 1.03;
            letter-spacing: -0.055em;
        }

        .lead {
            max-width: 580px;
            margin: 24px 0 32px;
            color: var(--muted);
            font-size: 18px;
            line-height: 1.68;
        }

        .actions { display: flex; gap: 12px; flex-wrap: wrap; }

        .button {
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 18px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface);
            font-weight: 750;
            text-decoration: none;
            box-shadow: 0 6px 18px rgba(23, 32, 51, 0.06);
        }

        .button-primary {
            border-color: var(--blue);
            color: #fff;
            background: var(--blue);
            box-shadow: 0 10px 24px rgba(31, 140, 235, 0.24);
        }

        .preview {
            position: relative;
            min-height: 440px;
            padding: 44px;
            border: 1px solid rgba(231, 235, 242, 0.95);
            border-radius: 28px;
            background:
                linear-gradient(135deg, rgba(31, 140, 235, 0.1), transparent 48%),
                #fff;
            box-shadow: 0 28px 70px rgba(38, 57, 77, 0.12);
        }

        .preview-card {
            max-width: 330px;
            margin: 82px auto 0;
            padding: 20px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 16px 38px rgba(23, 32, 51, 0.09);
        }

        .preview-line {
            height: 10px;
            margin: 12px 0;
            border-radius: 999px;
            background: #edf1f6;
        }

        .preview-line:first-child { width: 46%; height: 13px; background: #d7e8fa; }
        .preview-line:nth-child(3) { width: 72%; }
        .preview-line:last-child { width: 58%; }

        .preview-bubble {
            position: absolute;
            right: 38px;
            bottom: 38px;
            width: 64px;
            height: 64px;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 50%;
            color: #fff;
            background: var(--blue);
            box-shadow: 0 14px 30px rgba(31, 140, 235, 0.34);
        }

        .preview-bubble svg { width: 28px; height: 28px; }

        @media (max-width: 840px) {
            .hero { grid-template-columns: 1fr; gap: 36px; }
            main { align-items: start; }
            h1 { max-width: 520px; }
            .preview { min-height: 330px; }
            .preview-card { margin-top: 38px; }
        }

        @media (max-width: 520px) {
            .container { width: min(100% - 24px, 1120px); }
            header { height: 68px; }
            main { min-height: calc(100vh - 68px); padding: 38px 0 88px; }
            .status { font-size: 12px; }
            h1 { font-size: 42px; }
            .lead { font-size: 16px; }
            .preview { min-height: 300px; padding: 20px; }
            .preview-bubble { right: 24px; bottom: 24px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { scroll-behavior: auto !important; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-inner">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M5 5.5h14v10H9l-4 3v-13Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                        <path d="M8.5 10.5h7M8.5 13h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                </span>
                Интерграм
            </div>
            <div class="status">Поддержка онлайн</div>
        </div>
    </header>

    <main>
        <div class="container hero">
            <section>
                <p class="eyebrow">Всегда на связи</p>
                <h1>Поможем с любым вопросом</h1>
                <p class="lead">
                    Напишите в чат — команда поддержки ответит в Telegram.
                    Обычно мы отвечаем в течение нескольких минут.
                </p>
                <div class="actions">
                    <a class="button button-primary" href="#chat">Открыть чат поддержки</a>
                    <a class="button" href="https://github.com/idoco/intergram" target="_blank" rel="noopener noreferrer">О проекте</a>
                </div>
            </section>

            <aside class="preview" aria-label="Предпросмотр чата">
                <div class="preview-card">
                    <div class="preview-line"></div>
                    <div class="preview-line"></div>
                    <div class="preview-line"></div>
                    <div class="preview-line"></div>
                </div>
                <button class="preview-bubble" type="button" aria-label="Открыть чат поддержки" onclick="document.getElementById('intergramRoot')?.querySelector('button')?.click()">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M4 4.5h16v12H9l-5 3v-15Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                        <path d="M8 9h8M8 12h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                </button>
            </aside>
        </div>
    </main>

    <script>
        window.intergramServer = window.location.origin;
        window.intergramCustomizations = {
            titleClosed: 'Чат поддержки',
            titleOpen: 'Чат с техподдержкой',
            introMessage: 'Привет! Чем можем помочь?',
            autoResponse: 'Сообщение доставлено. Постараемся ответить в ближайшее время.',
            autoNoResponse: 'Сейчас мы офлайн. Оставьте вопрос — ответим позже.',
            placeholderText: 'Напишите сообщение…',
            mainColor: '#1f8ceb',
            closedStyle: 'button',
            alwaysUseFloatingButton: false,
            desktopWidth: 370,
            desktopHeight: 450
        };
    </script>
    <script id="intergram" src="/js/widget.js"></script>
</body>
</html>
